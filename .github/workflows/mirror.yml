name: Mirror Repository

on:
  push:
    branches:
      - master

jobs:
  mirror:
    if: github.repository == 'Jeetendra-G-Vasisht/Grocery-store'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRRORCHECK }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "ERROR: MIRRORCHECK secret is empty or unavailable."
            exit 1
          fi

          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/jeetendravasisht/Grocery-store.git"

      - name: Test mirror access
        run: |
          git ls-remote mirror

      - name: Push to mirror
        run: |
          git push mirror --mirror
